experiment_name: "v2_replication"
seed: 42
output_dir: "./results/v2"

data_collection:
  loader: "NativeDiscoveryLoader"
  loader_params:
    seed_term: "Mental Health"
    min_count: 1000
    max_terms: 20

preprocessing:
  pipeline:
    - transformer: "HistoricalEnrichmentTransformer"
      params:
        historical_years: [2020, 2021, 2022, 2023, 2024]

analysis:
  model:
    class: "IdentityModel"
    params: {}

results:
  plots: ["NativeVisualizer"]
  export:
    format: "json"
