experiment_name: "mesh_v2_analytics"
seed: 42
output_dir: "scripts/research/mesh/v12/output/v2"

data_collection:
  loader: "CSVLoader"
  loader_params:
    file_path: "data/mesh_trends.csv"

preprocessing:
  pipeline:
    - transformer: "ZScoreScaler"
      params: {}

analysis:
  model:
    class: "CAGRCalculator"
    params: {}
  validation:
    strategy: "TimeSplit"
    params: {}
  metrics: ["cagr", "z_score"]

results:
  plots: ["trend_line"]
  export:
    format: "csv"
