experiment_name: "mesh_v9_unified"
seed: 42
output_dir: "scripts/research/mesh/v12/output/v9"

data_collection:
  loader: "UnifiedMeSHLoader"
  loader_params:
    seed_term: "Depression"
    exclude_generic: true
    total_max_terms: 20

preprocessing:
  pipeline: []

analysis:
  model:
    class: "NativeV9Engine"
    params:
      discovery:
        max_levels: 2
        level_thresholds: {1: 15000, 2: 5000}
        total_max_terms: 20
      temporal:
        enabled: true
        start_year: 2020
        end_year: 2024
      clinical_trials:
        enabled: true
        max_pages: 1
  metrics: ["completed"]

results:
  plots: ["confusion_matrix", "feature_importance"]
  export:
    format: "json"
