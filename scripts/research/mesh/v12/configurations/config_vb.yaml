experiment_name: "mesh_vb_minimal"
seed: 42
output_dir: "scripts/research/mesh/v12/output/vb"

data_collection:
  loader: "UrllibLoader"
  loader_params:
    seed_term: "Mental Health"

preprocessing:
  pipeline: []

analysis:
  model:
    class: "NativeVBEngine"
    params:
      max_depth: 1
      threshold: 10000
      max_terms: 5
  metrics: ["completed"]

results:
  plots: ["NativeVisualizer"]
  export:
    format: "json"
